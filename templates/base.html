<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pharmacy{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">Pharmacy</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('medicines') }}">Medicines</a>
      <a class="nav-link" href="{{ url_for('new_sale') }}">New sale</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
